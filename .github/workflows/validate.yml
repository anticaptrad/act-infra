name: Validate manifests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: manifests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject unresolved conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Unresolved Git conflict markers found.' >&2
            exit 1
          fi

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Validate manifests and policy invariants
        run: python3 tests/validate_manifests.py
