# act-api-server — guarded HTTP control plane and NATS event-bus bridge for the
# Anticaptrad YouTube GAS app.
# Deployed to the k8s cluster at ~/codes/ores/k8s-cluster.
#
# ADMIN_API_KEY and YOUTUBE_GAS_API_KEY are materialized by
# deployments/act-api-server.externalsecret.yaml from Fiducia. The two keys are
# deliberately independent and are never committed to this repository.
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-api-server-config
  labels:
    app: act-api-server
data:
  PORT: "8080"
  OTEL_SERVICE_NAME: "act-api-server"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  NATS_URL: "nats://nats:4222"
  RUST_LOG: "info,act_api_server=debug"
  YOUTUBE_GAS_URL: "https://script.google.com/macros/s/AKfycbwXNUnFogkqg_aeobBMLCas21CHJ8eIR8W1AnmEBNx7pPgfio8eARW5J4A-lu_V5gY/exec"
  YOUTUBE_EXPECTED_CHANNEL_HANDLE: "@anticaptrad"
  YOUTUBE_GAS_TIMEOUT_SECS: "30"
  YOUTUBE_GAS_MAX_RESPONSE_BYTES: "4194304"
  # Public and unlisted actions remain disabled until DEN-402's private upload
  # rehearsal and audit reconciliation have passed.
  YOUTUBE_ALLOW_PUBLIC_ACTIONS: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-api-server
  labels:
    app: act-api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: act-api-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: act-api-server
      annotations:
        secret.reloader.stakater.com/reload: act-api-server-secrets
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: anticaptrad/act-api-server:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: act-api-server-config
            - secretRef:
                name: act-api-server-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: act-api-server
  labels:
    app: act-api-server
spec:
  selector:
    app: act-api-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
