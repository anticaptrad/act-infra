# Materialize only the two credentials required by the guarded YouTube control
# plane. Values live in Fiducia and never appear in Git, Linear, images, or logs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: act-api-server-secrets
  labels:
    app: act-api-server
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-fiducia-kv
  target:
    name: act-api-server-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ADMIN_API_KEY
      remoteRef:
        key: k8s/default/act-api-server/ADMIN_API_KEY
    - secretKey: YOUTUBE_GAS_API_KEY
      remoteRef:
        key: k8s/default/act-api-server/YOUTUBE_GAS_API_KEY
