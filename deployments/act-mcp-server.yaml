# act-mcp-server — Model Context Protocol server over JSON-RPC (Rust/axum).
# Deployed to the k8s cluster at ~/codes/ores/k8s-cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-mcp-server-config
  labels:
    app: act-mcp-server
data:
  PORT: "8080"
  OTEL_SERVICE_NAME: "act-mcp-server"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  RUST_LOG: "info,act_mcp_server=debug"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-mcp-server
  labels:
    app: act-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: act-mcp-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: act-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: anticaptrad/act-mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: act-mcp-server-config
            - secretRef:
                name: act-mcp-server-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: act-mcp-server
  labels:
    app: act-mcp-server
spec:
  selector:
    app: act-mcp-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
