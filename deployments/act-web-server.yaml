# act-web-server — Supabase-authenticated HTTP API (Rust/axum + sea-orm).
# Deployed to the k8s cluster at ~/codes/ores/k8s-cluster.
#
# Secrets (DATABASE_URL, SUPABASE_JWT_SECRET) come from the
# `act-web-server-secrets` Secret populated by the fiducia external-secrets
# operator. Non-secret config is in a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-web-server-config
  labels:
    app: act-web-server
data:
  PORT: "8080"
  OTEL_SERVICE_NAME: "act-web-server"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  SUPABASE_JWT_AUD: "authenticated"
  RUST_LOG: "info,act_web_server=debug"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-web-server
  labels:
    app: act-web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: act-web-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: act-web-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: anticaptrad/act-web-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: act-web-server-config
            - secretRef:
                name: act-web-server-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: act-web-server
  labels:
    app: act-web-server
spec:
  selector:
    app: act-web-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
