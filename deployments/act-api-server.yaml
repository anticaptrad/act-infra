apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-api-server
  labels:
    app: act-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: act-api-server
  template:
    metadata:
      labels:
        app: act-api-server
    spec:
      volumes:
        - name: secrets-vol
          emptyDir: {}
      initContainers:
        - name: fiducia-secrets-loader
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Fetching secrets from fiducia.cloud..."
              echo "export API_KEY=mock-secret" > /secrets/.env
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
          env:
            - name: FIDUCIA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fiducia-auth-secret
                  key: token
                  optional: true
      containers:
        - name: app
          image: anticaptrad/act-api-server:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["source /secrets/.env && ./act-api-server-rs"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
---
apiVersion: v1
kind: Service
metadata:
  name: act-api-server
spec:
  selector:
    app: act-api-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
